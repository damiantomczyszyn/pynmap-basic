name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # 1. Lint, testy jednostkowe, build wersji C
  # ---------------------------------------------------------------------
  test:
    name: Testy (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalacja narzędzi
        run: |
          python -m pip install --upgrade pip
          # Ruff przypięty: bez pinu nowa wersja z nowymi regułami oblewa
          # build na commicie, który nie zmienił ani linijki kodu.
          pip install "pytest>=8.0" "ruff==0.17.5"

      - name: Ruff
        run: ruff check .

      - name: Testy bez roota (pomija -sS)
        run: python -m pytest tests/ -q

      - name: Testy jako root (włącza testy -sS na raw socketach)
        run: sudo "$(which python)" -m pytest tests/ -q

      - name: Build wersji C (-Wall -Wextra -Wpedantic)
        run: |
          # pipefail jest konieczny: domyslna powloka to 'bash -e' BEZ pipefail,
          # wiec kod wyjscia potoku to kod `tee`, czyli zawsze 0 — nieudana
          # kompilacja przechodzila, o ile tylko komunikat nie zawieral slowa
          # "warning" ani "error", ktore wylapuje grep ponizej.
          set -o pipefail
          make -C c_reference clean
          make -C c_reference 2>&1 | tee /tmp/build.log
          if grep -qiE "warning|error" /tmp/build.log; then
            echo "::error::Kompilator zgłosił ostrzeżenia"
            exit 1
          fi

      - name: AddressSanitizer na wersji C
        run: |
          make -C c_reference asan
          ASAN_OPTIONS=detect_leaks=1 ./c_reference/connect_scan 127.0.0.1 1-256 --open

  # ---------------------------------------------------------------------
  # 2. Realny test sieciowy: usługi w kontenerach, skanowane przez docker0
  # ---------------------------------------------------------------------
  network:
    name: Realny skan sieciowy
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.scan.outcome == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Postawienie usług w kontenerach
        id: targets
        run: |
          docker run -d --name pynmap-nginx nginx:alpine
          docker run -d --name pynmap-redis redis:alpine

          # czekamy, aż usługi faktycznie zaczną nasłuchiwać
          for i in $(seq 1 30); do
            docker exec pynmap-nginx sh -c 'wget -qO- http://127.0.0.1/ >/dev/null 2>&1' \
              && docker exec pynmap-redis sh -c 'redis-cli ping >/dev/null 2>&1' \
              && break
            sleep 1
          done

          ip_of() {
            docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$1"
          }
          NGINX_IP="$(ip_of pynmap-nginx)"
          REDIS_IP="$(ip_of pynmap-redis)"

          echo "nginx=$NGINX_IP" >> "$GITHUB_OUTPUT"
          echo "redis=$REDIS_IP" >> "$GITHUB_OUTPUT"

          echo "### Cele skanu" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Kontener | IP na mostku | Nasłuchuje |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| nginx:alpine | \`$NGINX_IP\` | 80 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| redis:alpine | \`$REDIS_IP\` | 6379 |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "--- trasa do kontenera (dowód, że to nie loopback) ---"
          ip route get "$NGINX_IP"
          ip -brief address show docker0 || true

      - name: Skan przez mostek docker0 (-sT i -sS) z weryfikacją
        id: scan
        run: |
          NGINX="${{ steps.targets.outputs.nginx }}"
          REDIS="${{ steps.targets.outputs.redis }}"

          # sudo domyślnie czyści środowisko, więc bez --preserve-env
          # wynik skanu traci informację, z jakiego commita pochodzi.
          sudo --preserve-env=GITHUB_SHA,GITHUB_REF_NAME,GITHUB_SERVER_URL,GITHUB_REPOSITORY,GITHUB_RUN_ID \
            "$(which python)" ci/network_check.py \
            --expect-open   "$NGINX:80" \
            --expect-closed "$NGINX:6379" \
            --expect-closed "$NGINX:22" \
            --expect-open   "$REDIS:6379" \
            --expect-closed "$REDIS:80" \
            --expect-closed "$REDIS:22" \
            --scan sT --scan sS \
            --json scan-results.json \
            --summary scan-summary.md

          cat scan-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Porównanie wersji C z wersją Python na tych samych celach
        run: |
          NGINX="${{ steps.targets.outputs.nginx }}"
          make -C c_reference clean && make -C c_reference

          ./c_reference/connect_scan "$NGINX" 22,80,6379 --reason \
            | awk '/\/tcp/ {print $1, $2}' | sort > /tmp/c.txt
          # Kolumny: C daje "port stan powod", Python "port stan usluga powod",
          # wiec stan w obu przypadkach jest w $2.
          python3 -m pynmap -sT -p 22,80,6379 -n --reason "$NGINX" \
            | awk '/\/tcp/ {print $1, $2}' | sort > /tmp/py.txt

          echo "### Zgodność C vs Python" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if diff -u /tmp/c.txt /tmp/py.txt > /tmp/diff.txt; then
            echo "Obie implementacje zwróciły identyczne stany portów:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/c.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Rozbieżność między C i Pythonem:**" >> "$GITHUB_STEP_SUMMARY"
            echo '```diff' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/diff.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Test informacyjny — host bez odpowiedzi ARP powinien dać filtered
        continue-on-error: true
        run: |
          SUBNET="$(echo "${{ steps.targets.outputs.nginx }}" | cut -d. -f1-3)"
          sudo "$(which python)" -m pynmap -sT -p 80 -n --reason \
            -T5 --max-retries 0 "$SUBNET.250" || true

      - name: Logi kontenerów przy niepowodzeniu
        if: failure()
        run: |
          docker ps -a
          docker logs pynmap-nginx || true
          docker logs pynmap-redis || true

      - name: Sprzątanie
        if: always()
        run: docker rm -f pynmap-nginx pynmap-redis || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-results
          path: |
            scan-results.json
            scan-summary.md
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------
  # 3. Test strony end-to-end: prawdziwy index.html w jsdom z prawdziwym
  #    Pyodide. To jedyna rzecz, która weryfikuje, że opublikowana strona
  #    faktycznie bootuje i liczy, a nie tylko że pliki się skopiowały.
  # ---------------------------------------------------------------------
  page:
    name: Test strony (jsdom + Pyodide)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Złożenie strony
        run: python3 web/build_site.py _preview

      - name: Instalacja jsdom i Pyodide
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Uruchomienie strony w jsdom
        env:
          PYNMAP_SITE: ${{ github.workspace }}/_preview
        run: node web/test_page.mjs

  # ---------------------------------------------------------------------
  # 4. Budowa i publikacja strony na GitHub Pages
  #    Deployuje tylko wtedy, gdy testy przeszły — strona zawsze odpowiada
  #    przetestowanemu commitowi. Wynik skanu dociąga z joba `network`,
  #    ale jego brak nie blokuje publikacji.
  # ---------------------------------------------------------------------
  pages:
    name: Publikacja na GitHub Pages
    needs: [test, network, page]
    # needs.network.result jest sprawdzany CELOWO: job `network` weryfikuje,
    # ze skaner zwraca prawidlowe stany portow na prawdziwym ruchu. Bez tego
    # warunku strona publikowala sie, mimo ze realny skan wykryl rozbieznosc —
    # a naglowek tego joba obiecuje, ze publiczny URL odpowiada PRZETESTOWANEMU
    # commitowi. Samo BRAK artefaktu nadal nie blokuje publikacji (krok
    # download ma continue-on-error) — to inna sytuacja niz oblany skan.
    if: ${{ always() && needs.test.result == 'success' && needs.page.result == 'success' && needs.network.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dociągnięcie wyniku realnego skanu
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: scan-results
          path: scan-artifact

      - name: Złożenie katalogu site/
        run: |
          if [ -f scan-artifact/scan-results.json ]; then
            python3 web/build_site.py site --scan scan-artifact/scan-results.json
          else
            python3 web/build_site.py site
          fi

      # Złożona strona jako zwykły artefakt — do pobrania niezależnie od
      # tego, czy Pages jest już włączone.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 14

      # enablement: true zadziała tylko, jeśli token ma prawa administratora
      # repo; samo `pages: write` nie wystarcza do UTWORZENIA site'u.
      # Dlatego krok jest nieblokujący, a brak Pages nie oblewa całego CI —
      # to jednorazowa czynność w ustawieniach, nie błąd w kodzie.
      - name: Konfiguracja Pages
        id: cfg
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Instrukcja, jeśli Pages nie jest włączone
        if: steps.cfg.outcome != 'success'
        run: |
          {
            echo "### Pages nie jest jeszcze włączone"
            echo ""
            echo "Strona została zbudowana i jest do pobrania jako artefakt"
            echo "\`site\` z tego przebiegu, ale nie da się jej opublikować,"
            echo "dopóki Pages nie zostanie włączone. Token workflow nie ma"
            echo "do tego uprawnień — tworzenie site'u wymaga praw"
            echo "administratora repozytorium."
            echo ""
            echo "Jednorazowo, w tym repo:"
            echo ""
            echo "1. **Settings → Pages**"
            echo "2. **Build and deployment → Source: GitHub Actions**"
            echo ""
            echo "Następny push opublikuje stronę automatycznie."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Pages wyłączone — pomijam publikację (to nie błąd w kodzie)."

      - uses: actions/upload-pages-artifact@v3
        if: steps.cfg.outcome == 'success'
        with:
          path: site

      - name: Deploy
        id: deploy
        if: steps.cfg.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Podsumowanie
        if: steps.cfg.outcome == 'success'
        run: |
          {
            echo "### Strona opublikowana"
            echo ""
            echo "<${{ steps.deploy.outputs.page_url }}>"
            echo ""
            echo "Zawiera warstwę algorytmiczną uruchamianą w przeglądarce"
            echo "przez Pyodide oraz wynik realnego skanu z tego przebiegu."
          } >> "$GITHUB_STEP_SUMMARY"
