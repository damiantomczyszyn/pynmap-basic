[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pynmap-basic"
version = "0.1.0"
description = "Nmapowy basic scan (TCP connect + SYN) przepisany z C/C++ na Pythona — projekt edukacyjny"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Damian Tomczyszyn" }]
keywords = ["nmap", "port-scanner", "tcp", "syn-scan", "networking", "security", "educational"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
pynmap = "pynmap.cli:main"

[project.urls]
Repository = "https://github.com/damiantomczyszyn/pynmap-basic"
Issues = "https://github.com/damiantomczyszyn/pynmap-basic/issues"

[tool.setuptools]
packages = ["pynmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # długość linii pilnuje formatter
    "SIM105",  # try/except/pass jest tu celowe przy socketach
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
